<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>政策周期分析 · 四步闭环工作流</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 48px 32px;
    background: #ffffff;
    font-family: 'Microsoft YaHei', 'Geist', system-ui, sans-serif;
    color: #1a1a1a;
  }
  .page { max-width: 720px; margin: 0 auto; }
  .eyebrow {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 8px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: #6e6e6e; margin: 0 0 8px;
  }
  h1 {
    font-family: 'Microsoft YaHei', 'Geist', system-ui, sans-serif;
    font-size: 1.5rem; font-weight: 700;
    color: #1a1a1a; margin: 0 0 8px;
  }
  .subtitle { font-size: 13px; color: #4a4a4a; margin: 0 0 24px; }
  svg { display: block; width: 100%; height: auto; }
  .colophon {
    margin-top: 24px; padding-top: 12px;
    border-top: 1px solid rgba(26,26,26,0.12);
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 8px; letter-spacing: 0.14em; color: #6e6e6e;
  }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">BILL POLICY CYCLE · WORKFLOW</p>
  <h1>政策周期分析 · 四步闭环工作流</h1>
  <p class="subtitle">采集 → 定位 → 推演 → 输出；每轮结果写回打分卡与概率记录，作为下一轮的历史先验。</p>

  <svg viewBox="0 0 560 524" role="img" aria-labelledby="policy-cycle-title policy-cycle-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="policy-cycle-title">政策周期分析四步闭环工作流</title>
    <desc id="policy-cycle-desc">会议通稿与政策文件依次经过采集、定位、推演、输出四个步骤生成定位报告，输出结果再反馈回采集环节形成闭环。</desc>

    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4a4a4a"/>
      </marker>
      <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#6e6e6e"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===== 连接线（先画线，再画节点） ===== -->
    <!-- 输入 → 采集 -->
    <line x1="300" y1="80" x2="300" y2="104" stroke="#4a4a4a" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- 采集 → 定位 -->
    <line x1="300" y1="168" x2="300" y2="192" stroke="#4a4a4a" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- 定位 → 推演 -->
    <line x1="300" y1="256" x2="300" y2="280" stroke="#4a4a4a" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- 推演 → 输出 -->
    <line x1="300" y1="344" x2="300" y2="368" stroke="#4a4a4a" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- 输出 →(虚线反馈)→ 采集 -->
    <path d="M 180 400 L 128 400 Q 120 400 120 392 L 120 144 Q 120 136 128 136 L 180 136"
          fill="none" stroke="#6e6e6e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>

    <!-- 反馈回路标签（线左侧，留白 8px） -->
    <rect x="32" y="260" width="80" height="16" rx="2" fill="#ffffff"/>
    <text x="108" y="272" fill="#6e6e6e" font-size="8" text-anchor="end"
          font-family="'Microsoft YaHei', 'Geist', sans-serif" letter-spacing="0.06em">新会议 / 新数据触发</text>

    <!-- ===== 输入节点（椭圆） ===== -->
    <rect x="180" y="32" width="240" height="48" rx="20" fill="#ffffff"/>
    <rect x="180" y="32" width="240" height="48" rx="20" fill="rgba(74,74,74,0.10)" stroke="#6e6e6e" stroke-width="0.8"/>
    <text x="300" y="54" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle"
          font-family="'Microsoft YaHei', 'Geist', sans-serif">会议通稿 / 政策文件</text>
    <text x="300" y="70" fill="#6e6e6e" font-size="9" text-anchor="middle"
          font-family="'Microsoft YaHei', 'Geist', sans-serif">政治局 · 中央经济工作会议 · 国常会 · 货政报告</text>

    <!-- ===== 步骤 1：采集 ===== -->
    <rect x="180" y="104" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="180" y="104" width="240" height="64" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="188" y="110" width="36" height="12" rx="2" fill="transparent" stroke="rgba(26,26,26,0.40)" stroke-width="0.8"/>
    <text x="206" y="119" fill="rgba(26,26,26,0.8)" font-size="7" text-anchor="middle"
          font-family="'Geist Mono', monospace" letter-spacing="0.08em">STEP 1</text>
    <text x="300" y="138" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle"
          font-family="'Microsoft YaHei', 'Geist', sans-serif">采集</text>
    <text x="300" y="154" fill="#4a4a4a" font-size="9" text-anchor="middle"
          font-family="'Microsoft YaHei', 'Geist', sans-serif">通稿解读模板 · 结构化提取</text>

    <!-- ===== 步骤 2：定位（焦点） ===== -->
    <rect x="180" y="192" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="180" y="192" width="240" height="64" rx="6" fill="rgba(139,0,0,0.08)" stroke="#8b0000" stroke-width="1.2"/>
    <rect x="188" y="198" width="36" height="12" rx="2" fill="transparent" stroke="rgba(139,0,0,0.40)" stroke-width="0.8"/>
    <text x="206" y="207" fill="rgba(139,0,0,0.8)" font-size="7" text-anchor="middle"
          font-family="'Geist Mono', monospace" letter-spacing="0.08em">STEP 2</text>
    <text x="300" y="226" fill="#8b0000" font-size="12" font-weight="600" text-anchor="middle"
          font-family="'Microsoft YaHei', 'Geist', sans-serif">定位</text>
    <text x="300" y="242" fill="#4a4a4a" font-size="9" text-anchor="middle"
          font-family="'Microsoft YaHei', 'Geist', sans-serif">六维打分卡 → 宽松度指数 → 周期位置</text>

    <!-- ===== 步骤 3：推演 ===== -->
    <rect x="180" y="280" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="180" y="280" width="240" height="64" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="188" y="286" width="36" height="12" rx="2" fill="transparent" stroke="rgba(26,26,26,0.40)" stroke-width="0.8"/>
    <text x="206" y="295" fill="rgba(26,26,26,0.8)" font-size="7" text-anchor="middle"
          font-family="'Geist Mono', monospace" letter-spacing="0.08em">STEP 3</text>
    <text x="300" y="314" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle"
          font-family="'Microsoft YaHei', 'Geist', sans-serif">推演</text>
    <text x="300" y="330" fill="#4a4a4a" font-size="9" text-anchor="middle"
          font-family="'Microsoft YaHei', 'Geist', sans-serif">政策惯性 + 先导信号 + 反应函数</text>

    <!-- ===== 步骤 4：输出 ===== -->
    <rect x="180" y="368" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="180" y="368" width="240" height="64" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="188" y="374" width="36" height="12" rx="2" fill="transparent" stroke="rgba(26,26,26,0.40)" stroke-width="0.8"/>
    <text x="206" y="383" fill="rgba(26,26,26,0.8)" font-size="7" text-anchor="middle"
          font-family="'Geist Mono', monospace" letter-spacing="0.08em">STEP 4</text>
    <text x="300" y="402" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle"
          font-family="'Microsoft YaHei', 'Geist', sans-serif">输出</text>
    <text x="300" y="418" fill="#4a4a4a" font-size="9" text-anchor="middle"
          font-family="'Microsoft YaHei', 'Geist', sans-serif">定位报告 · 目标重心 / 路径 / 资产含义</text>

    <!-- ===== 图例（底部横条） ===== -->
    <line x1="32" y1="468" x2="528" y2="468" stroke="rgba(26,26,26,0.12)" stroke-width="0.8"/>
    <text x="32" y="488" fill="#6e6e6e" font-size="8" letter-spacing="0.14em"
          font-family="'Geist Mono', monospace">LEGEND</text>
    <line x1="120" y1="484" x2="152" y2="484" stroke="#4a4a4a" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="160" y="488" fill="#4a4a4a" font-size="8"
          font-family="'Microsoft YaHei', 'Geist', sans-serif">工作流</text>
    <line x1="232" y1="484" x2="264" y2="484" stroke="#6e6e6e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
    <text x="272" y="488" fill="#4a4a4a" font-size="8"
          font-family="'Microsoft YaHei', 'Geist', sans-serif">循环反馈：结果写回打分卡与概率记录</text>
  </svg>

  <p class="colophon">BILL POLICY CYCLE SKILL · FOUR-STEP OPERATING LOOP</p>
</div>
</body>
</html>
